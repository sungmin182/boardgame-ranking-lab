<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보드게임 랭킹 랩</title>
    <meta name="description" content="BGG 데이터를 내 방식대로 정렬하는 보드게임 랭킹 도구" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" id="homeLink" href="./" title="처음 화면으로 (필터·정렬 초기화)">
        <span class="brand-mark" aria-hidden="true">
          <span class="pip"></span><span class="pip"></span><span class="pip"></span>
          <span class="pip"></span><span class="pip"></span><span class="pip"></span>
        </span>
        <span class="brand-text">
          <h1>보드게임 랭킹 랩</h1>
          <span class="stamp" id="stamp">불러오는 중…</span>
        </span>
      </a>
      <div class="topbar-actions">
        <label class="search-field">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 L18 18"/></svg>
          <input id="search" type="search" placeholder="게임명 검색 (한글/영문)" autocomplete="off" />
          <kbd>/</kbd>
        </label>
        <button id="themeToggle" class="theme-btn" title="화면 모드">
          <span class="theme-icon">◐</span>
          <span class="theme-label">시스템</span>
        </button>
      </div>
    </header>

    <main>
      <!-- 넓은 화면에서는 좌측(점수·필터) / 우측(결과) 두 칸으로 나뉜다.
           1180px 아래에서는 예전처럼 위아래로 쌓인다. -->
      <div class="workspace" id="workspace">
      <aside class="sidebar" id="sidebar">
      <!-- ── 나만의 랭킹 점수 ───────────────────────────────── -->
      <section class="panel" id="scorePanel">
        <div class="panel-head">
          <h2>
            <button class="collapse-btn" data-panel="score" aria-expanded="true" aria-controls="scoreBody">
              <span class="chev" aria-hidden="true">▾</span>
            </button>
            <span class="eyebrow">01</span>나만의 랭킹 점수
            <span class="panel-summary" id="scoreSummary"></span>
          </h2>
          <div class="presets" id="presets"></div>
        </div>
        <div class="panel-body" id="scoreBody">
          <div class="sliders" id="sliders"></div>
          <p class="hint">
            각 항목의 가중치를 조절하면 표가 실시간으로 다시 정렬됩니다. 음수로 내리면 그 특성이
            <em>적을수록</em> 높은 점수를 받습니다. 예: 인기도를 &minus;로 두면 아직 안 알려진 게임이 위로 올라옵니다.
          </p>
        </div>
      </section>

      <!-- ── 필터 ──────────────────────────────────────────── -->
      <section class="panel" id="filterPanel">
        <div class="panel-head">
          <h2>
            <button class="collapse-btn" data-panel="filter" aria-expanded="true" aria-controls="filterBody">
              <span class="chev" aria-hidden="true">▾</span>
            </button>
            <span class="eyebrow">02</span>필터
            <span class="panel-summary" id="filterSummary"></span>
          </h2>
          <button id="resetFilters" class="ghost-btn">필터 초기화</button>
        </div>

        <div class="panel-body" id="filterBody">
        <div class="filter-grid">
          <div class="field">
            <label>인원 <span class="sub" id="playersLabel">전체</span></label>
            <div class="chips" id="playersChips"></div>
            <label class="check">
              <input type="checkbox" id="strictPlayers" />
              <span>“베스트”로 뽑힌 인원만 (추천 제외)</span>
            </label>
          </div>

          <div class="field">
            <label>난이도 <span class="sub" id="weightLabel">1.0 – 5.0</span></label>
            <div class="dual" id="weightRange"></div>
            <div class="chips" id="weightChips"></div>
          </div>

          <div class="field">
            <label>플레이 시간(분) <span class="sub" id="timeLabel">전체</span></label>
            <div class="dual" id="timeRange"></div>
            <label class="check">
              <input type="checkbox" id="timeByMax" checked />
              <span>최대 시간 기준으로 판정</span>
            </label>
          </div>

          <div class="field">
            <label>출시 연도 <span class="sub" id="yearLabel">전체</span></label>
            <div class="dual" id="yearRange"></div>
            <div class="chips" id="yearChips"></div>
          </div>

          <div class="field">
            <label>BGG 순위 <span class="sub" id="rankLabel">전체</span></label>
            <div class="dual" id="rankRange"></div>
            <div class="chips" id="rankChips"></div>
          </div>

          <div class="field">
            <label>평가 수 <span class="sub" id="votesLabel">전체</span></label>
            <div class="dual" id="votesRange"></div>
          </div>

          <div class="field">
            <label>메커니즘</label>
            <div class="tagbox" id="mechBox"></div>
          </div>

          <div class="field">
            <label>카테고리</label>
            <div class="tagbox" id="catBox"></div>
          </div>

          <div class="field">
            <label>내 목록 <span class="sub" id="listLabel">전체</span></label>
            <div class="chips" id="listChips"></div>
          </div>

          <div class="field">
            <label>기타</label>
            <label class="check">
              <input type="checkbox" id="risingOnly" />
              <span>30일간 순위가 오른 게임만</span>
            </label>
            <label class="check">
              <input type="checkbox" id="noTextOnly" />
              <span>게임 내 텍스트 없음 (언어 무관)</span>
            </label>
            <label class="check">
              <input type="checkbox" id="krOnly" />
              <span title="한글 발매명이 있거나 국내 발매사가 등록된 게임">국내 정발판이 있는 것만</span>
            </label>
            <label class="check">
              <input type="checkbox" id="myListOnly" />
              <span>관심·보유 전부</span>
            </label>
            <label class="check">
              <input type="checkbox" id="hideExcluded" checked />
              <span>제외 표시한 게임 숨기기</span>
            </label>
            <div class="excluded-note" id="excludedNote" hidden></div>
          </div>
        </div>
        </div>
      </section>

      </aside>

      <!-- ── 결과 ──────────────────────────────────────────── -->
      <section class="panel results">
        <div class="panel-head">
          <h2>
            <button
              id="sidebarToggle"
              class="icon-btn"
              title="점수·필터 패널 접기 / 펼치기"
              aria-label="점수·필터 패널 접기"
            >☰</button>
            <span class="eyebrow">03</span>결과
            <span class="count-badge" id="resultCount">–</span>
          </h2>
          <div class="result-actions">
            <div class="seg" id="viewMode" role="group" aria-label="보기 방식">
              <button data-view="table" class="on">표</button>
              <button data-view="cards">카드</button>
            </div>
            <label class="check inline">
              <input type="checkbox" id="showNotes" />
              <span title="내 평점 · 플레이 수 · 1판당 비용 열">내 기록</span>
            </label>
            <label class="check inline">
              <input type="checkbox" id="compactMode" />
              <span>간결히</span>
            </label>
            <button id="myShelf" class="ghost-btn">내 서재</button>
            <button id="myPlan" class="ghost-btn">수업 계획</button>
            <button id="copyLink" class="ghost-btn">링크 복사</button>
            <button id="exportCsv" class="ghost-btn">CSV 내보내기</button>
          </div>
        </div>

        <div class="table-wrap" id="tableWrap">
          <table id="table">
            <thead>
              <tr id="headRow"></tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div id="cards" class="card-grid" hidden></div>
          <div id="empty" class="empty" hidden>조건에 맞는 게임이 없습니다.</div>
          <div id="sentinel" class="sentinel" hidden>더 불러오는 중…</div>
        </div>

        <!-- 1만 개를 훑을 때 "지금 어디쯤인지"를 알려주는 줄 -->
        <div class="result-foot">
          <span id="shownCount" class="sub">–</span>
          <button id="toTop" class="ghost-btn" hidden>맨 위로 ↑</button>
        </div>
      </section>
      </div>
    </main>

    <div id="drawer" class="drawer" hidden></div>

    <!-- 비교 담기 바 / 비교 화면 -->
    <div id="compareBar" class="compare-bar" hidden></div>
    <div id="compareView" class="compare-view" hidden></div>

    <!-- 내 기록 요약 (투자·플레이·먼지 쌓인 게임·백업) -->
    <div id="shelfView" class="compare-view" hidden></div>

    <!-- 학생 수업용 연간 계획 (달별 커리큘럼) -->
    <div id="planView" class="compare-view" hidden></div>

    <div id="modal" class="modal" hidden></div>
    <div id="toast" class="toast" hidden></div>

    <script src="assets/config.js"></script>
    <script src="assets/terms.js"></script>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
