# Cloudflare Worker 배포 설정
#
#   npx wrangler login                            # 최초 1회, 브라우저에서 인증
#   npx wrangler deploy --config proxy/wrangler.toml
#
# 배포되면 https://<name>.<계정>.workers.dev 주소가 나온다.
# 그 주소를 assets/config.js 의 LIVE_PROXY 에 넣으면 실시간 새로고침이 켜진다.

name = "bgg-live-proxy"
main = "worker.js"
compatibility_date = "2026-08-01"

# 관측용 로그(무료 플랜에서도 사용 가능)
[observability]
enabled = true

# 리뷰 한국어 번역에 사용. 별도 API 키 없이 이 계정에서 바로 돈다.
[ai]
binding = "AI"

# 기기 간 기록 동기화 저장소.
#
# 저장되는 것은 브라우저에서 암호로 잠근 덩어리뿐이다. 워커도, Cloudflare도
# 내용을 볼 수 없다(자세한 설명은 worker.js 의 /sync 부분).
#
# 처음부터 다시 세팅할 때만 새로 만든다(그러면 id 를 아래에 갈아 넣는다):
#   npx wrangler kv namespace create SYNC --config proxy/wrangler.toml
#
# 무료 한도: 하루 쓰기 1,000회 / 읽기 10만회. 개인용으로는 충분하다.
[[kv_namespaces]]
binding = "SYNC"
id = "d962ca429679403daf12ae18e8608ab1"
